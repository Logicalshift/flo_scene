[package]
name            = "flo_scene_binding"
version         = "0.3.0"
edition         = "2021"
authors         = ["Andrew Hunter"]
license         = "Apache-2.0"
readme          = "../README.md"
repository      = "https://github.com/Logicalshift/flo_scene"
description     = "Support for reactive subprograms in flo_scene using flo_binding"
categories      = [ "concurrency", "data-structures" ]
keywords        = [ "message-queue" ]

[dependencies]
flo_scene   = "0.3"
flo_binding = "2.2"
futures     = "0.3"

[dev-dependencies]
serde       = { version = "1.0", features = [ "derive" ] }
