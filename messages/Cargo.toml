[package]
name            = "flo_scene_messages"
version         = "0.3.0"
edition         = "2021"
authors         = ["Andrew Hunter"]
license         = "Apache-2.0"
readme          = "../README.md"
repository      = "https://github.com/Logicalshift/flo_scene"
description     = "The base set of messages for flo_scene"
categories      = [ "concurrency", "data-structures" ]
keywords        = [ "message-queue" ]

[features]
default         = [ "use-std" ]
json            = [ "serde_json" ]
postcard        = [ "dep:postcard" ]
use-std         = [ "postcard?/use-std", "uuid/std", "uuid/v4", "futures/std", "serde/std", "serde_json?/std" ]
use-random      = [ "uuid/u4" ]
one-thread      = [ "spin" ]

[dependencies]
futures     = { version = "0.3", default-features = false, features = [ "alloc" ] }
serde       = { version = "1.0", default-features = false, features = [ "derive", "alloc" ] }
serde_json  = { version = "1.0", default-features = false, features = [ "alloc" ], optional = true }
postcard    = { version = "1.0", default-features = false, features = [ "alloc" ], optional = true }
uuid        = { version = "1.0", default-features = false, features = [ "serde" ] }
spin        = { version = "0.10", default-features = false, features = [ "mutex", "spin_mutex", "once" ], optional = true }
